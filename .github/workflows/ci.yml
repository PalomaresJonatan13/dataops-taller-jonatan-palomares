name: DataOps CI Pipeline

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: uv sync

    - name: Create database
      run: uv run python scripts/create_db.py

    - name: Run static analysis
      run: |
        uv run pylint src/ --fail-under=7.0
        uv run black --check src/
        uv run bandit -r src/

    - name: Run unit tests
      run: uv run pytest tests/ -v --cov=src --cov-report=xml

    - name: Run data quality tests
      run: uv run pytest tests/test_data_quality.py -v

    - name: Train model and save artifact
      run: uv run python src/dataops_taller_jonatan_palomares/train.py

    - name: Upload model artifact
      uses: actions/upload-artifact@v7
      with:
        name: trained-model
        path: models/model.pkl